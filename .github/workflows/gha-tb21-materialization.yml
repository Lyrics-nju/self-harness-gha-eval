name: GHA TB2.1 Materialization Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-tb21-materialization-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Minimal runner and Internet sanity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports work/tb21
          {
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            uname -a
            lsb_release -a
            nproc
            free -b
            df --output=avail -B1 /
            docker version
          } > reports/runner.txt 2>&1
          printf 'target,exit_code,http_status\n' > reports/network.csv
          for target in https://github.com/ https://hub.harborframework.com/datasets/terminal-bench/terminal-bench-2-1/latest; do
            set +e; code=$(curl --proto '=https' --tlsv1.2 -LsS --retry 0 --connect-timeout 15 --max-time 45 -o /dev/null -w '%{http_code}' "$target"); rc=$?; set -e
            printf '%s,%s,%s\n' "$target" "$rc" "$code" >> reports/network.csv
            [ "$rc" -eq 0 ] && [ "$code" = 200 ] || exit 1
          done
      - name: Install exact Harbor and audit resolver
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf --retry 0 https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install 'harbor==0.21.0'
          test "$(harbor --version)" = 0.21.0
          harbor download --help > reports/harbor_download_help.txt
          python3 evaluation/tests/test_tb21_dataset_policy.py | tee reports/resolver_tests.txt
          printf '%s\n' 'harbor.cli.download:download_command,_download_dataset' 'harbor.db.client:RegistryDB.get_package_type,RegistryDB.resolve_dataset_version' 'harbor.registry.client.package:PackageDatasetClient._get_dataset_metadata,download_dataset' 'harbor.models.package.reference:PackageReference.parse' 'harbor.auth.client:create_authenticated_client' > reports/resolver_symbols.txt
      - name: Discover and materialize without executing tasks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          env -u HARBOR_API_KEY "$HOME/.local/share/uv/tools/harbor/bin/python" scripts/gha_tb21_materialization.py --output-dir work/tb21 --reports reports > reports/diagnostic.stdout 2> reports/diagnostic.stderr
          rc=$?
          set -e
          cat reports/diagnostic.stdout
          cat reports/diagnostic.stderr >&2
          exit "$rc"
      - name: Secret scan evidence
        id: scan
        if: always()
        shell: bash
        run: scripts/public_secret_scan.py --artifact-mode reports
      - name: Upload sanitized diagnostic evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gha-tb21-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          if-no-files-found: error
          retention-days: 14
