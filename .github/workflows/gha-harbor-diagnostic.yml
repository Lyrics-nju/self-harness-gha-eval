name: GHA Harbor Exception Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-harbor-exception-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Minimal runner baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "runner.os=${RUNNER_OS}"
            echo "runner.arch=${RUNNER_ARCH}"
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            uname -a
            lsb_release -a
            nproc
            free -h
            df -h
            docker version
          } > reports/diagnostic_runner.txt 2>&1
      - name: Minimal network and Docker sanity
        shell: bash
        run: scripts/gha_minimal_sanity.sh
      - name: Install exact Harbor
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf --retry 0 https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install 'harbor==0.21.0'
          test "$(harbor --version)" = '0.21.0'
          harbor --version > reports/diagnostic_harbor_version.txt
      - name: Structured parser regression 8 of 8
        shell: bash
        run: python3 evaluation/tests/test_harbor_exception_policy.py | tee reports/diagnostic_parser_regression.txt
      - name: Exactly one Harbor synthetic diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          scripts/gha_harbor_diagnostic.sh
      - name: Secret scan sanitized diagnostic evidence
        id: artifact_scan
        if: always()
        shell: bash
        run: python3 scripts/public_secret_scan.py --artifact-mode reports
      - name: Upload sanitized diagnostic evidence
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gha-harbor-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          if-no-files-found: error
          retention-days: 14
