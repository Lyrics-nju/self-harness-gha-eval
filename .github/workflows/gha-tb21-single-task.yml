name: GHA TB2.1 Single Task Oracle Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-tb21-single-task-oracle-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner and Docker sanity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports work/jobs
          {
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            uname -a
            lsb_release -a
            nproc
            free -b
            df --output=avail -B1 /
            docker version
          } > reports/runner.txt 2>&1
          docker run --rm hello-world > reports/docker_sanity.txt
          cp .github/workflows/gha-tb21-single-task.yml reports/workflow.yml
      - name: Install Harbor and exact dataset preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf --retry 0 https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install 'harbor==0.21.0'
          test "$(harbor --version)" = 0.21.0
          harbor --version | tee reports/harbor_version.txt
          python3 evaluation/tests/test_tb21_dataset_policy.py | tee reports/resolver_tests.txt
          python3 evaluation/tests/test_single_task_summary.py | tee reports/summary_tests.txt
          env -u HARBOR_API_KEY "$HOME/.local/share/uv/tools/harbor/bin/python" scripts/gha_tb21_resolve_exact.py
          printf '%s\n' 'TASK_SELECTION_RULE=LEXICOGRAPHIC_FIRST' 'SELECTED_TASK_ID=terminal-bench/adaptive-rejection-sampler' > reports/task_selection.txt
      - name: Execute exactly one Oracle trial
        id: trial
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          disk_before=$(df --output=avail -B1 / | tail -1 | tr -d ' ')
          start=$(date +%s)
          set +e
          env -u HARBOR_API_KEY harbor run --dataset terminal-bench/terminal-bench-2-1@sha256:7d7bdc1cbedad549fc1140404bd4dc45e5fd0ea7c4186773687d177ad3a0699a --include-task-name terminal-bench/adaptive-rejection-sampler --agent oracle --env docker --n-concurrent 1 --n-attempts 1 --max-retries 0 --job-name m1b17h-single-task --jobs-dir work/jobs --yes > work/harbor.stdout 2> work/harbor.stderr
          harbor_rc=$?
          set -e
          wall=$(( $(date +%s)-start ))
          disk_after=$(df --output=avail -B1 / | tail -1 | tr -d ' ')
          set +e
          python3 scripts/gha_single_task_summary.py --job-dir work/jobs/m1b17h-single-task --harbor-exit "$harbor_rc" --wall-seconds "$wall" --disk-before "$disk_before" --disk-after "$disk_after" --output reports/single_task_execution.json
          summary_rc=$?
          set -e
          exit "$summary_rc"
      - name: Scan deterministic summaries
        id: scan
        if: always()
        shell: bash
        run: scripts/public_secret_scan.py --artifact-mode reports
      - name: Upload deterministic evidence
        id: upload
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m1b17h-single-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          if-no-files-found: error
          retention-days: 14
